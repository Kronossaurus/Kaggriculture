[project]
name = "kaggriculture"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.0",
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.6",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.8",
]

# CUDA build of torch, scoped to just this package (explicit=true keeps this
# index out of resolution for everything else -- see rl/README.md for why).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
# External kernels pulled in for pool comparison (reference/*, see their own
# docstrings) are kept byte-identical to the source notebook -- not written
# to our style and not ours to reformat -- so they're excluded from lint.
extend-exclude = ["reference/x492_nah_i_d_win.py"]

[tool.ruff.lint]
# Default select (E4, E7, E9, F) plus E402: several scripts under rl/ deliberately
# import after a sys.path.insert() (to import repo-root modules from scripts/rl
# subdirs) and already mark those with `# noqa: E402` -- E402 needs to be enabled
# for those to mean anything, otherwise ruff itself flags them as unused noqa.
extend-select = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
